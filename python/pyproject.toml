[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armada-sdk"
version = "0.1.0"
description = "Run a function over many inputs at once, on armada's Cloudflare Containers."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["armada"]

[tool.setuptools.package-data]
armada = ["py.typed"]
